<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="popGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full Bleed Squircle Background -->
  <rect width="64" height="64" rx="14" fill="url(#favBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#818cf8" stroke-width="1.8" stroke-opacity="0.8"/>

  <!-- Fast Forward Fleet Wing (Left Trail, Prominent) -->
  <path d="M11 15L27 32L11 49" stroke="#1e1b4b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  <path d="M12 16L27 32L12 48" stroke="#a5b4fc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- Main Forward Freight Arrow / Navigator (Lead Wing, Edge-to-Edge) -->
  <path d="M26 13L46 32L26 51" stroke="url(#arrowGrad)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#popGlow)"/>

  <!-- Large Waypoint Telemetry Target Node -->
  <circle cx="46" cy="32" r="5" fill="#10b981" filter="url(#popGlow)"/>
  <circle cx="46" cy="32" r="2.2" fill="#ffffff"/>

  <!-- Corner Live Satellite Indicator -->
  <circle cx="13" cy="13" r="3.2" fill="#38bdf8"/>
  <circle cx="13" cy="13" r="1.5" fill="#ffffff"/>
</svg>